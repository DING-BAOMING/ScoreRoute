name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-gateway/web/package-lock.json

      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build backend
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o scoreroute-${{ steps.get_version.outputs.VERSION }}-linux-amd64 \
            ./cmd/server
        working-directory: ai-gateway

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: ai-gateway/web

      - name: Prepare release files
        run: |
          mkdir -p release
          ls -la ai-gateway/
          cp ai-gateway/scoreroute-${{ steps.get_version.outputs.VERSION }}-linux-amd64 release/
          cp -r ai-gateway/web/dist release/
          cp ai-gateway/docker-compose.yml release/
          cp ai-gateway/.env.example release/
          cp -r ai-gateway/docs release/ 2>/dev/null || true
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/**
          body: |
            ## ScoreRoute v${{ steps.get_version.outputs.VERSION }}

            AI Gateway and intelligent routing system based on multi-dimensional model scoring.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
