name: Cleanup Stale Branches

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Stale Branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete merged branches
        run: |
          git fetch --prune
          for branch in $(git branch --merged main --format "%(refname:short)" | grep -v "^main$"); do
            echo "Deleting merged branch: $branch"
            git push origin --delete "$branch" || true
          done

      - name: Find and delete stale branches (30+ days inactive)
        run: |
          git fetch --prune
          thirty_days_ago=$(date -d '30 days ago' +%s)
          for branch in $(git for-each-ref --format '%(refname:short) %(committerdate:unix)' refs/heads | awk '{if ($2 < '$thirty_days_ago') print $1}'); do
            # Skip main and protected branches
            if [[ "$branch" != "main" ]] && [[ "$branch" != "master" ]]; then
              echo "Deleting stale branch: $branch"
              git push origin --delete "$branch" || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
