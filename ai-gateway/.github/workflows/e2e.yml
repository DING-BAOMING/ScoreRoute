name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-docs-rendering:
    name: Docs Rendering Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build backend
        run: go build -o server ./cmd/server/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Install Playwright
        run: npm install -D @playwright/test && npx playwright install --with-deps chromium

      - name: Start server
        run: |
          ./server &
          sleep 5
          curl -s http://localhost:3000/health || exit 1

      - name: Check Docs.vue doc-item class exists
        run: |
          curl -s http://localhost:3000/docs/getting-started.md | grep -q "快速开始" && echo "Docs API works" || exit 1

  e2e-token-key:
    name: Token Key Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build backend
        run: go build -o server ./cmd/server/

      - name: Start server
        run: |
          ./server &
          sleep 5

      - name: Test Token creation
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST http://localhost:3000/api/tokens \
            -H "Content-Type: application/json" \
            -d '{"name":"test","format":"openai","type":"chat","enabled":1}')
          KEY=$(echo $TOKEN_RESPONSE | grep -o '"key":"[^"]*"' | cut -d'"' -f4)
          if [ ${#KEY} -ge 35 ]; then
            echo "Token key length is correct: ${#KEY}"
          else
            echo "Token key too short: ${#KEY}"
            exit 1
          fi

      - name: Test Token GetByID returns full key
        run: |
          ID=$(curl -s -X POST http://localhost:3000/api/tokens \
            -H "Content-Type: application/json" \
            -d '{"name":"test-fullkey","format":"openai","type":"chat","enabled":1}' | grep -o '"id":[0-9]*' | cut -d':' -f2)
          FULL_RESPONSE=$(curl -s http://localhost:3000/api/tokens/$ID)
          KEY=$(echo $FULL_RESPONSE | grep -o '"key":"[^"]*"' | cut -d'"' -f4)
          if [ ${#KEY} -ge 35 ]; then
            echo "GetByID returns full key: ${#KEY}"
          else
            echo "GetByID returns truncated key: ${#KEY}"
            exit 1
          fi

  e2e-docker-volume:
    name: Docker Volume Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose.yml has named volumes
        run: |
          grep -q "scoreroute-data:/app/data" docker-compose.yml && echo "Named volume found" || exit 1
          grep -q "scoreroute-logs:/app/logs" docker-compose.yml && echo "Logs volume found" || exit 1
          grep -q "scoreroute-cache:/app/cache" docker-compose.yml && echo "Cache volume found" || exit 1
