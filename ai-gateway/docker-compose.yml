version: '3.8'

services:
  app:
    build: .
    container_name: ai-gateway
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/gateway.db
      - LOG_PATH=/app/logs
    networks:
      - scoreroute-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  scoreroute-network:
    driver: bridge
