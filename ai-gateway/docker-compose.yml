version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_PATH=/app/data/gateway.db
      - LOG_PATH=/app/logs
    networks:
      - scoreroute-network

networks:
  scoreroute-network:
    driver: bridge
