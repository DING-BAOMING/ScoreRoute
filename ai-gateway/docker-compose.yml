version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - scoreroute-data:/app/data
      - scoreroute-logs:/app/logs
      - scoreroute-cache:/app/cache
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_PATH=/app/data/gateway.db
      - LOG_PATH=/app/logs
    networks:
      - scoreroute-network

volumes:
  scoreroute-data:
  scoreroute-logs:
  scoreroute-cache:

networks:
  scoreroute-network:
    driver: bridge
