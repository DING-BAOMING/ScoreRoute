# ============================================
# ScoreRoute Nginx 配置示例
# ============================================
# 
# 使用说明:
# 1. 将此文件复制到 /etc/nginx/sites-available/scoreroute
# 2. 修改以下配置:
#    - YOUR_DOMAIN: 替换为您的域名
#    - /var/www/ai-gateway/web/dist: 替换为前端dist目录实际路径
#    - SSL证书路径: 替换为您的证书文件路径
# 3. 启用配置: ln -s /etc/nginx/sites-available/scoreroute /etc/nginx/sites-enabled/
# 4. 重启nginx: systemctl restart nginx
#

# --------------------------------------------
# HTTP 配置 (重定向到 HTTPS)
# --------------------------------------------
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # 强制跳转到 HTTPS
    return 301 https://$server_name$request_uri;
}

# --------------------------------------------
# HTTPS 配置
# --------------------------------------------
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL 证书配置 (请修改为您的证书路径)
    ssl_certificate /etc/ssl/certs/your-cert.pem;
    ssl_certificate_key /etc/ssl/private/your-cert.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 64m;

    # 前端静态文件
    location / {
        root /var/www/ai-gateway/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # V1 API 代理 (支持流式响应)
    location /v1/ {
        proxy_pass http://localhost:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # 流式响应需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/ai-gateway/web/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
